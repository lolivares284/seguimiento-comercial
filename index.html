<style>
  :root{
    /* DITALCAR · tokens de marca (Identidad Visual 2025) */
    --dc-rojo:#9D202F; --dc-negro:#1E1E1E; --dc-burdeos:#28090A; --dc-crema:#FFFEF1; --dc-arena:#CAC59D; --dc-tierra:#B7997B;
    --ink:var(--dc-negro); --ink-2:#4a3f3a; --muted:#7c7067; --line:#dcd6c0; --line-soft:#ebe7d6;
    --paper:#ffffff; --surface:var(--dc-crema); --surface-2:#f2efdf;
    --accent:var(--dc-rojo); --accent-ink:#7a1824; --accent-soft:#f6e6e8;
    --ok:#2e7d4f; --ok-soft:#e3f1e8; --warn:#a9731a; --warn-soft:#f8efd9; --bad:#b3261e; --bad-soft:#f7e1de;
    --info:#6b5540; --info-soft:#f1ebe2;
    --radius:6px;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-titulo:"Montserrat","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent-ink)}
  .num{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  /* ---------- login ---------- */
  #login{min-height:100%;display:grid;place-items:center;padding:24px;background:var(--dc-burdeos)}
  .login-card{background:var(--dc-crema);width:100%;max-width:400px;padding:32px 28px;border-radius:10px;border-top:5px solid var(--dc-rojo)}
  h1,h2,h3,.kpi .v,.brand strong{font-family:var(--font-titulo);font-weight:600}
  .login-card h1{margin:0 0 4px;font-size:18px;font-weight:600}
  .login-logo{display:block;width:230px;max-width:100%;margin:0 auto 18px}
  .login-card p{margin:0 0 20px;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
  .field label{font-size:13px;color:var(--ink-2);font-weight:500}
  .input,select,textarea{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:var(--paper);min-height:36px;width:100%}
  .input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);padding:8px 14px;cursor:pointer;min-height:36px;white-space:nowrap}
  .btn:hover{background:var(--surface)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.danger{color:var(--bad);border-color:#efc7c7}
  .btn.sm{padding:4px 9px;min-height:28px;font-size:13px}
  .btn:disabled{opacity:.55;cursor:default}
  .error{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}

  /* ---------- shell ---------- */
  #app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
  aside{background:var(--dc-burdeos);color:#eadfd9;display:flex;flex-direction:column;padding:18px 0;position:sticky;top:0;height:100vh}
  .brand{padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  .brand img{display:block;width:170px;max-width:100%;margin-bottom:12px}
  .brand strong{display:block;color:#fff;font-weight:600;font-size:13px;letter-spacing:.02em}
  .brand span{font-size:12px;color:#c9b1ac}
  nav{display:flex;flex-direction:column;padding:12px 10px;gap:2px;flex:1}
  nav button{text-align:left;background:none;border:0;color:#dccbc6;padding:9px 12px;border-radius:var(--radius);cursor:pointer;border-left:3px solid transparent}
  nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  nav button.active{background:rgba(157,32,47,.35);color:#fff;font-weight:500;border-left-color:var(--dc-rojo)}
  .userbox{padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
  .userbox .name{color:#fff;font-weight:500}
  .userbox .role{color:#c9b1ac;margin-bottom:10px}
  .userbox button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--radius);padding:5px 10px;cursor:pointer}
  main{padding:22px 26px 60px;min-width:0}
  .page-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
  .page-head h2{margin:0;font-size:19px;font-weight:600;margin-right:auto}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .filters select,.filters .input{width:auto;min-width:140px}
  .count{color:var(--muted);font-size:13px}

  /* ---------- tables ---------- */
  .tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:72vh}
  table{border-collapse:collapse;width:100%;min-width:720px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle;white-space:nowrap}
  th{position:sticky;top:0;background:var(--surface-2);font-weight:500;font-size:12.5px;color:var(--ink-2);z-index:1}
  tr:hover td{background:#f8fafc}
  td.right,th.right{text-align:right}
  td select{min-height:30px;padding:3px 6px;width:auto;max-width:160px}
  .empty{padding:36px;text-align:center;color:var(--muted)}

  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:18px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .pill.info{background:var(--info-soft);color:var(--info)}
  .pill.mute{background:var(--surface-2);color:var(--muted)}

  /* ---------- dashboard ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .kpi .v{font-size:24px;font-weight:600;line-height:1.1}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:4px}
  .kpi .s{font-size:12px;color:var(--ink-2);margin-top:6px}
  tfoot td{font-weight:600;background:var(--surface);position:sticky;bottom:0}

  /* ---------- forms / cards ---------- */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:15px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .grid .field{margin:0}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .hint{color:var(--muted);font-size:12.5px}
  .check{display:flex;align-items:center;gap:6px;min-height:36px}

  /* ---------- dropzone ---------- */
  .drop{border:2px dashed var(--line);border-radius:10px;padding:34px;text-align:center;background:var(--paper);color:var(--muted);cursor:pointer}
  .drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .drop strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
  .log{font-size:13px;white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px;max-height:280px;overflow:auto;margin-top:12px}
  .progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:10px}
  .progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(22,35,59,.45);display:grid;place-items:center;padding:16px;z-index:50}
  .modal{background:var(--paper);border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px}
  .modal h3{margin:0 0 12px;font-size:16px}
  .modal .close{float:right}
  .kv{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:5px 14px;font-size:13px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;word-break:break-word}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--dc-burdeos);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.2)}
  .toast.bad{background:var(--bad)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 0 0}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:0}
  .bar i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
  /* velocímetros y tablas de marcas */
  .gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
  .gauge{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 8px 8px;text-align:center}
  .gauge svg{width:100%;max-width:150px;display:block;margin:0 auto}
  .gauge .gv{font-family:var(--font-titulo);font-weight:600;font-size:20px;margin-top:-6px}
  .gauge .gl{font-size:12px;color:var(--muted)}
  .gauge .gs{font-size:11.5px;color:var(--ink-2)}
  tr.total td{font-weight:600;background:var(--surface-2)}
  /* colores de grupo (mismos del RESUMEN Excel) */
  :root{--g-ventas:#AC74D6;--g-creditos:#C00000;--g-ci:#FFC000;--g-mpp:#00B0F0;--g-seguros:#00B050;--g-leads:#199F9C;--g-tasaciones:#B7997B;--g-proyecciones:#28090A}
  .kpi[class*="g-"]{border-top:4px solid var(--gc,var(--line))}
  .kpi[class*="g-"] .l{color:var(--gc);font-weight:600}
  .g-ventas{--gc:var(--g-ventas)} .g-creditos{--gc:var(--g-creditos)} .g-ci{--gc:var(--g-ci)} .g-mpp{--gc:var(--g-mpp)} .g-seguros{--gc:var(--g-seguros)} .g-leads{--gc:var(--g-leads)} .g-tasaciones{--gc:var(--g-tasaciones)} .g-proyecciones{--gc:var(--g-proyecciones)}
  th.grp[class*="g-"]{background:var(--gc);color:#fff}
  th.grp.g-ci{color:#1E1E1E}
  td.bar{background-image:linear-gradient(90deg,var(--bc,#e8e3d0) var(--bw,0%),transparent var(--bw,0%));background-origin:padding-box}
  .notif-btn{position:relative;background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--radius);padding:5px 10px;cursor:pointer}
  .notif-btn .n{position:absolute;top:-7px;right:-7px;background:var(--dc-rojo);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px;font-weight:600}
  .notif{border-bottom:1px solid var(--line-soft);padding:10px 0}
  .notif.nueva{background:var(--accent-soft);margin:0 -8px;padding:10px 8px;border-radius:4px}
  .notif b{display:block}
  tr.repetido td{background:var(--bad-soft)}
  tr.sub td{background:#faf8ef;font-size:12.5px;color:var(--ink-2)}
  tr.sub td:first-child{padding-left:28px}
  button.exp{border:1px solid var(--line);background:var(--paper);border-radius:4px;width:22px;height:22px;line-height:18px;padding:0;cursor:pointer;font-size:12px;margin-right:6px;color:var(--accent)}
  th.grp{text-align:center;background:var(--dc-burdeos);color:#fff;font-family:var(--font-titulo);font-weight:600;letter-spacing:.03em;border-left:1px solid rgba(255,255,255,.2)}
  .imp-head{display:flex;align-items:center;gap:12px;margin:18px 0 8px}
  .imp-head h3{margin:0;font-size:16px}
  .imp-head .hint{margin-left:auto}
  .bar b{color:var(--ink);font-weight:500}
  .bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  td input.input{min-height:30px;padding:3px 6px;width:90px}
  @media (max-width:860px){
    #app{grid-template-columns:1fr}
    aside{position:static;height:auto;padding:10px 0 0}
    .brand{padding:6px 16px 10px}
    .brand img{width:130px;margin-bottom:6px}
    nav{flex-direction:row;overflow-x:auto;padding:8px 10px}
    nav button{white-space:nowrap}
    .userbox{display:flex;gap:10px;align-items:center;padding:8px 16px 10px;border-top:0}
    .userbox .role{margin:0}
    .userbox button{margin-left:auto}
    main{padding:14px}
    .tablewrap{max-height:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function $(sel, root=document){ return root.querySelector(sel); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function esc(v){ return v==null ? "" : String(v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isoDate(d){ if(!d) return null; const x=new Date(d); if(isNaN(x)) return null; return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function lunes(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function fmtDate(v){ if(!v) return ""; const s=String(v).slice(0,10); const [y,m,d]=s.split("-"); return d&&m&&y ? `${d}-${m}-${y}` : s; }
function fmtDateTime(v){ if(!v) return ""; const x=new Date(v); if(isNaN(x)) return String(v); return fmtDate(isoDate(x))+" "+String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0"); }
function fmtMoney(v){ if(v==null||v==="") return ""; const n=Number(v); if(isNaN(n)) return esc(v); return "$"+n.toLocaleString("es-CL",{maximumFractionDigits:0}); }
function fmtNum(v){ if(v==null||v==="") return ""; const n=Number(v); return isNaN(n)?esc(v):n.toLocaleString("es-CL"); }
function fmtRut(r){ if(!r) return ""; r=String(r); const dv=r.slice(-1), cuerpo=r.slice(0,-1); return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g,".")+"-"+dv; }
function normRut(r){ if(r==null) return null; const s=String(r).toUpperCase().replace(/[^0-9K]/g,""); return s||null; }
function normPatente(p){ if(p==null) return null; const s=String(p).toUpperCase().replace(/[^0-9A-Z]/g,""); return (!s||s==="ET0000")?null:s; }
function num(v){ if(v==null||v==="") return null; if(typeof v==="number") return v; const s=String(v).replace(/[^0-9,.-]/g,"").replace(/\.(?=\d{3})/g,"").replace(",","."); const n=parseFloat(s); return isNaN(n)?null:n; }
function intv(v){ const n=num(v); return n==null?null:Math.round(n); }
function txt(v){ if(v==null) return null; const s=String(v).trim(); return (s===""||s==="-")?null:s; }
function parseDate(v){
  if(v==null||v===""||v==="-") return null;
  if(v instanceof Date) return isNaN(v)?null:isoDate(v);
  if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:null; }
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m=s.match(/^(\d{4})(\d{2})(\d{2})$/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  const d=new Date(s); return isNaN(d)?null:isoDate(d);
}
function parseDateTime(v){
  if(v instanceof Date) return isNaN(v)?null:v.toISOString();
  const s=String(v||"").trim(); const m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})\s+(\d{1,2}):(\d{2})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]).toISOString();
  const d=parseDate(v); return d?new Date(d+"T12:00:00").toISOString():null;
}
function normCel(c){ if(c==null) return null; const d=String(c).replace(/[^0-9]/g,""); return d.length>=9?d.slice(-9):null; }
function normEmail(e){ const s=String(e??"").trim().toLowerCase(); return s||null; }
/* CSV simple con comillas y saltos de línea dentro de campos */
function parseCSV(text, delim=","){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"'&&cell==="") q=true;
    else if(ch==='"') cell+=ch;
    else if(ch===delim){ row.push(cell); cell=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
/* Mismo rango de fechas, un mes antes */
function periodoAnterior(d,h){
  const sh=s=>{ const x=new Date(s+"T12:00:00"); const dia=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()-1); const ult=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(dia,ult)); return isoDate(x); };
  return { desde:sh(d), hasta:sh(h) };
}
async function dosPeriodos(build){

  const [cur,ant]=await Promise.all([ fetchAll(()=>build(S.filtro.desde,S.filtro.hasta)), fetchAll(()=>build(prev.desde,prev.hasta)) ]);
  return { cur, ant, prev };
}

function pill(text, kind){ return `<span class="pill ${kind}">${esc(text)}</span>`; }
function estadoPill(e){
  const s=String(e||"").toLowerCase();
  if(/curs|aprobado$|^activa|exito|firmad/.test(s)&&!/pre/.test(s)) return pill(e,"ok");
  if(/rechaz|caduc|anulad|caida|no firm/.test(s)) return pill(e,"bad");

  return pill(e||"—","mute");
}

/* ---------- acceso a datos ---------- */
async function fetchAll(build){
  const out=[]; const page=1000; let from=0;
  while(true){
    const { data, error } = await build().range(from, from+page-1);
    if(error) throw error;
    out.push(...(data||[]));
    if(!data||data.length<page) break;
    from+=page;
  }
  return out;
}

async function cargarCatalogos(){

    sb.from("marcas").select("*").order("nombre"),

    sb.from("financieras").select("*").order("nombre"),
    sb.from("local_alias").select("*").order("fuente").order("alias"),
    sb.from("parametros").select("*"),
    sb.from("marca_importador").select("*").order("orden"),
    sb.from("vendedores").select("*").order("nombre"),
    sb.from("vendedor_alias").select("*"),
  ]);
  S.marcas=m.data||[]; S.locales=l.data||[]; S.financieras=f.data||[]; S.alias=a.data||[]; S.marcaImp=mi.data||[];
  S.vend=vd.data||[]; S.vendAlias=va.data||[];
  S.vendById=Object.fromEntries(S.vend.map(v=>[v.id,v])); S.vendByRut=Object.fromEntries(S.vend.filter(v=>v.rut).map(v=>[v.rut,v]));
  S.vendAliasMap={}; S.vendAlias.forEach(x=>{ if(x.vendedor_id) S.vendAliasMap[x.fuente+"|"+String(x.alias).trim().toUpperCase()]=x.vendedor_id; });
  S.param={}; (pr.data||[]).forEach(x=>S.param[x.clave]=x.valor);
  S.misGrupos=[];
  if(isAdmin()) S.misLocales=S.locales.filter(x=>x.activo);
  else{
    const [ul,um]=await Promise.all([
      sb.from("usuario_locales").select("local_id").eq("usuario_id",S.user.id),
      sb.from("usuario_marcas").select("marca_id").eq("usuario_id",S.user.id)]);
    const ids=new Set((ul.data||[]).map(x=>x.local_id)); const marcas=new Set((um.data||[]).map(x=>x.marca_id));
    S.misGrupos=S.marcas.filter(m=>marcas.has(m.id)).map(m=>m.nombre.toUpperCase());

  }
}

/* ---------- filtros y tablas compartidas ---------- */
/* Marcas de vehículo que puede ver el usuario: gerente de marca → las de sus grupos; el resto → todas */
function marcasPermitidas(){
  const todas=(S.marcaImp||[]).filter(x=>x.marca!=="USADOS");
  if(S.perfil?.rol!=="gerente_marca"||!S.misGrupos?.length) return todas;
  const g=new Set(S.misGrupos.map(x=>normMarca(x)));
  const r=todas.filter(x=>g.has(x.importador)||g.has(x.marca)); return r.length?r:todas;
}
function marcaPermitida(nombre){ const p=marcasPermitidas(); if(p.length===(S.marcaImp||[]).filter(x=>x.marca!=="USADOS").length) return true; const n=normMarca(nombre); return p.some(x=>x.marca===n)||/SEMI|USAD/i.test(nombre||""); }
/* Filtro por marca del vehículo (no por el grupo del local) */
function marcaSelectHtml(){
  const imps=["ASTARA","STELLANTIS","GEELY"]; const sel=S.filtro.marca;
  const marcas=marcasPermitidas();
  let h=`<select id="fMarcaV"><option value="">Todas las marcas</option>`;
  imps.forEach(i=>{ const ms=marcas.filter(x=>x.importador===i); if(!ms.length) return;
    h+=`<optgroup label="${i}"><option value="imp:${i}" ${sel==="imp:"+i?"selected":""}>Todas las de ${i}</option>${ms.map(x=>`<option value="${esc(x.marca)}" ${sel===x.marca?"selected":""}>${esc(x.marca)}</option>`).join("")}</optgroup>`; });
  const otras=marcas.filter(x=>!imps.includes(x.importador)); if(otras.length) h+=`<optgroup label="OTRAS">${otras.map(x=>`<option value="${esc(x.marca)}" ${sel===x.marca?"selected":""}>${esc(x.marca)}</option>`).join("")}</optgroup>`;
  h+=`<option value="USADOS" ${sel==="USADOS"?"selected":""}>Seminuevos / usados</option></select>`; return h;
}
/* Marca efectiva de cualquier registro: si es usado (VU, "usado", "seminuevo") → SEMINUEVOS; si no, la marca del vehículo */
function esUsadoReg(r){ return !!r.es_usado||/USADO|SEMI/i.test(r.estado_vehiculo||r.estado_vh||r.tipo_negocio||"")||/^SEMI|^USAD/i.test(r.marca||""); }
function marcaReg(r){ return esUsadoReg(r)?"SEMINUEVOS":(normMarca(r.marca??r.tipo_negocio??"")||"SIN MARCA"); }
function filtroMarca(){
  const sel=S.filtro.marca; if(!sel) return ()=>true;
  if(sel==="USADOS") return r=>marcaReg(r)==="SEMINUEVOS";
  if(sel.startsWith("imp:")){ const imp=sel.slice(4); return r=>{ const m=marcaReg(r); return m!=="SEMINUEVOS"&&importadorDe(m)===imp; }; }
  return r=>marcaReg(r)===sel;
}

}
/* Exportar la tabla visible a Excel: toma el texto de cada celda (sin HTML). */
function exportarExcel(nombre, cols, rows){
  if(!puedeExportar()){ toast("Tu rol no permite descargar información.",true); return; }
  if(!rows?.length){ toast("No hay datos para exportar.",true); return; }

  const texto=h=>{ tmp.innerHTML=h; const sel=tmp.querySelector("select"); return sel?sel.options[sel.selectedIndex]?.text||"":tmp.textContent.trim(); };
  const data=rows.map(r=>{ const o={}; cols.forEach(c=>{ if(!c.h) return; o[c.h]=c.raw?c.raw(r):texto(c.f(r)); }); return o; });
  const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,nombre.slice(0,30));
  XLSX.writeFile(wb,`${nombre}_${isoDate(new Date())}.xlsx`);
}

function bindFiltros(onApply){

function filtrarTexto(rows, campos){
  const q=S.filtro.q.toLowerCase(); if(!q) return rows;
  const qr=normRut(q);
  return rows.filter(r=>campos.some(c=>{ const v=r[c]; if(v==null) return false; const s=String(v).toLowerCase(); return s.includes(q)||(qr&&qr.length>5&&s.includes(qr)); }));
}
function tabla(cols, rows, {foot=null}={}){
  if(!rows.length) return `<div class="tablewrap"><div class="empty">No hay registros con estos filtros.</div></div>`;
  const th=cols.map(c=>`<th class="${c.right?"right":""}">${esc(c.h)}</th>`).join("");
  const body=rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.right?"right num":""}">${c.f(r)}</td>`).join("")}</tr>`).join("");
  return `<div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${foot?`<tfoot>${foot}</tfoot>`:""}</table></div>`;
}
/* Tabla con filas desplegables: getSubs(r) devuelve las sub-filas (mismos campos) de cada fila */
function tablaExp(cols, rows, getSubs, {foot=null}={}){
  if(!rows.length) return `<div class="tablewrap"><div class="empty">No hay registros con estos filtros.</div></div>`;
  const th=cols.map(c=>`<th class="${c.right?"right":""}">${esc(c.h)}</th>`).join("");
  const body=rows.map((r,i)=>{ const subs=getSubs(r)||[];
    const main=`<tr>${cols.map((c,j)=>`<td class="${c.right?"right num":""}">${j===0?(subs.length?`<button class="exp" data-exp="${i}" title="Ver desglose">▸</button>`:""):""}${c.f(r)}</td>`).join("")}</tr>`;
    const sub=subs.map(x=>`<tr class="sub hidden" data-sub="${i}">${cols.map((c,j)=>`<td class="${c.right?"right num":""}">${j===0?"↳ ":""}${c.f(x)}</td>`).join("")}</tr>`).join("");
    return main+sub; }).join("");
  return `<div class="tablewrap"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${foot?`<tfoot>${foot}</tfoot>`:""}</table></div>`;
}
function bindExp(root){ root.querySelectorAll("[data-exp]").forEach(b=>b.addEventListener("click",()=>{ const abrir=b.textContent==="▸"; b.textContent=abrir?"▾":"▸"; root.querySelectorAll(`[data-sub="${b.dataset.exp}"]`).forEach(tr=>tr.classList.toggle("hidden",!abrir)); })); }

}

  const locOpts=S.misLocales.map(l=>`<option value="${l.id}">${esc(l.nombre)}</option>`).join("");

    <div id="tabHistorico" class="hidden"></div>
    <div id="tabSemana">
    <div class="page-head" style="margin-top:-4px"><span class="hint">Semana del</span>
      <div class="row"><button class="btn sm" id="semPrev">‹</button><input class="input" type="date" id="semana" value="${semana}" style="width:auto"><button class="btn sm" id="semNext">›</button>
        <select id="pRep" style="width:auto"><option value="">Todas</option><option value="rep">Solo RUT repetidos</option></select>${marcaSelectHtml()}${puedeExportar()?`<button class="btn sm" id="pExcel">Exportar Excel</button>`:""}</div>
    </div>
    <div id="resumen" style="margin-bottom:10px"></div>
    <div class="card"><h3>Agregar proyección</h3>
      <div class="grid">
        <div class="field"><label>Local</label><select id="pLocal">${locOpts}</select></div>
        <div class="field"><label>Marca que se vende</label><select id="pMarca"><option value="">— elegir —</option>${(S.marcaImp||[]).filter(x=>x.marca!=="USADOS").map(x=>`<option>${esc(x.marca)}</option>`).join("")}<option>SEMINUEVO</option></select></div>
        <div class="field"><label>Vendedor</label><select id="pVendSel"><option value="">— elegir —</option></select><input class="input hidden" id="pVend" placeholder="Nombre del vendedor"></div>
        <div class="field"><label>RUT cliente</label><input class="input" id="pRut" placeholder="12.345.678-9"></div>

        <div class="field"><label>Nota de venta</label><input class="input" id="pNota" inputmode="numeric"></div>
        <div class="field"><label>ID lead PILOT</label><input class="input" id="pLead" inputmode="numeric" placeholder="Vacío si no viene de lead"></div>
        <div class="field"><label>Canal</label><select id="pCanal"><option value="piso">Piso</option><option value="web">Web</option></select></div>
        <div class="field"><label>Patente auto en retoma</label><input class="input" id="pPat" placeholder="Vacío si no hay retoma"></div>
        <div class="field"><label>Observación</label><input class="input" id="pObs"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="pAdd">Agregar a la semana</button><span class="hint" id="pCruce"></span></div>
    </div>
    <div id="tbl"></div>
    </div>`;
  main.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
    main.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));
    $("#tabSemana").classList.toggle("hidden",b.dataset.tab!=="semana"); $("#tabHistorico").classList.toggle("hidden",b.dataset.tab!=="historico");
    if(b.dataset.tab==="historico") renderHistorico($("#tabHistorico")); });
  $("#pExcel")?.addEventListener("click",()=>exportarExcel("Proyecciones_"+semana,S.exp?.cols||[],S.exp?.rows||[]));
  $("#pRep").addEventListener("change",()=>run()); $("#fMarcaV").addEventListener("change",()=>run());

  const vendPorLocal={}; let todosVend=new Set();
  { const vs=await fetchAll(()=>sb.from("ventas").select("vendedor,local_id").gte("fecha",isoDate(addDays(new Date(),-180))).not("vendedor","is",null));
    vs.forEach(v=>{ const n=vendedorCanon("siga",v.vendedor); (vendPorLocal[v.local_id]||(vendPorLocal[v.local_id]=new Set())).add(n); todosVend.add(n); }); }
  const llenarVend=()=>{ const loc=+$("#pLocal").value; const lista=[...(vendPorLocal[loc]||todosVend)].sort();
    $("#pVendSel").innerHTML=`<option value="">— elegir —</option>${lista.map(v=>`<option>${esc(v)}</option>`).join("")}<option value="__otro">Otro (escribir)…</option>`; $("#pVend").classList.add("hidden"); $("#pVend").value=""; };

  $("#semana").addEventListener("change",()=>cambiarSemana(new Date($("#semana").value+"T12:00:00")));

  // cruce en vivo al escribir RUT / patente
  const cruceVivo=async()=>{
    const rut=normRut($("#pRut").value), pat=normPatente($("#pPat").value); const out=[];
    if(rut&&rut.length>=7){
      const [{data:c},{data:s}]=await Promise.all([

        sb.from("seguros").select("propuesta_estado").eq("rut_asegurado",rut).order("fecha_propuesta",{ascending:false}).limit(1)]);
      out.push(c?.length?`Crédito ${c[0].financiera} (${ESTADOS_CREDITO[c[0].estado_gestion]})`:"Sin crédito registrado");
      out.push(s?.length?`Seguro ${s[0].propuesta_estado}`:"Sin seguro registrado");
    }
    if(pat){ const {data:t}=await sb.from("tasaciones").select("fecha_solicitud").eq("patente",pat).limit(1); out.push(t?.length?`Retoma tasada el ${fmtDate(t[0].fecha_solicitud)}`:"Retoma sin tasación"); }

    if(lid){ const {data:ld}=await sb.from("leads").select("nombre,apellido,origen,estado,rut,celular,email").eq("id_externo",lid).maybeSingle();

  $("#pAdd").addEventListener("click",async()=>{

    const row={ semana, local_id:+$("#pLocal").value, marca:txt($("#pMarca").value)||null, vendedor, rut_cliente:normRut($("#pRut").value),

    row.retoma=!!row.patente_retoma;
    if(!row.vendedor&&!row.rut_cliente){ toast("Indica al menos el vendedor o el RUT del cliente.",true); return; }
    if(row.rut_cliente){ const {data:prev}=await sb.from("v_proyecciones").select("semana,local_nombre").eq("rut_cliente",row.rut_cliente).limit(5);

};
/* El CSV de PILOT trae cada fila completa entre comillas y termina en ;;;; — se desenvuelve aquí */
function desenvolverPilot(text){
  const t=text.replace(/^\ufeff/,"");
  if(!/^"ID,/.test(t.trimStart())) return null;
  const blobs=parseCSV(t,";").map(r=>r[0]).filter(x=>x&&x.trim());
  return parseCSV(blobs.join("\n"),",");
}
function limpiarHeader(h){ return String(h??"").replace(/^\ufeff/,"").trim(); }
function leerHoja(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  let hi=-1, fuente=null;
  for(let i=0;i<Math.min(rows.length,15);i++){
    const h=(rows[i]||[]).map(limpiarHeader);
    for(const [k,f] of Object.entries(FUENTES)) if(f.detectar(h)){ hi=i; fuente=k; break; }
    if(fuente) break;
  }
  if(!fuente) return null;
  const headers=rows[hi].map(limpiarHeader); const seen={};
  const objs=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i]; if(!r||r.every(v=>v==null||v==="")) continue;
    const o={}; headers.forEach((h,j)=>{ if(!h) return; if(h in o) return; o[h]=r[j]; }); objs.push(o);
  }
  return { fuente, headers, objs };
}
function extraDe(o){ const e={}; for(const [k,v] of Object.entries(o)){ if(v==null||v==="") continue; e[k]= v instanceof Date ? isoDate(v) : v; } return e; }
function canalDesde(origen){ const s=String(origen||"").toUpperCase(); return /WEB|DIGITAL|INTERNET|CONTACT|ONLINE|REDES|LEAD/.test(s)?"web":"piso"; }
function estadoCreditoDesde(est){ const s=String(est||"").toUpperCase(); if(/CURSAD|SALDO PRECIO/.test(s)) return "cursado"; if(/RECHAZ|CADUC|DESIST|ANULAD/.test(s)) return "rechazado"; return "pre_aprobado"; }

async function procesarArchivo(file, log, setProgress){
  const buf=await file.arrayBuffer();
  let ws;
  if(/\.csv$/i.test(file.name)){
    const text=new TextDecoder("utf-8").decode(buf);
    const aoa=desenvolverPilot(text);
    ws = aoa ? XLSX.utils.aoa_to_sheet(aoa) : XLSX.read(text,{type:"string",raw:true}).Sheets["Sheet1"];
  } else { const wb=XLSX.read(buf,{type:"array",cellDates:true}); ws=wb.Sheets[wb.SheetNames[0]]; }
  const hoja=leerHoja(ws);
  if(!hoja){ log(`✗ ${file.name}: no reconozco el formato. Revisa que sea una exportación de SIGA, Santander, Forum, HDI o Autored.`); return; }
  const F=FUENTES[hoja.fuente]; log(`▸ ${file.name}: detectado como ${F.nombre} (${hoja.objs.length} filas)`);
  const aliasMap={}; S.alias.filter(a=>a.fuente===hoja.fuente).forEach(a=>aliasMap[a.alias.trim().toUpperCase()]=a.local_id);
  const sinLocal=new Set(); const rows=[]; const vistos=new Set();
  for(const o of hoja.objs){
    const r=MAPEOS[hoja.fuente](o); const k=CLAVE_FILA[hoja.fuente](r);
    if(k==null||k===""||vistos.has(String(k))) continue; vistos.add(String(k));
    const origen=r[F.campoLocal]; r.local_id = origen ? (aliasMap[origen.trim().toUpperCase()] ?? null) : null;
    if(origen&&r.local_id==null) sinLocal.add(origen.trim());
    rows.push(r);
  }
  if(!rows.length){ log(`  Sin filas válidas.`); return; }
  // Créditos: no pisar el estado de gestión que ya trabajó un jefe de local
  let grupos=[rows];
  if(F.tabla==="creditos"){
    const existentes=new Map();
    for(let i=0;i<rows.length;i+=300){
      const ops=rows.slice(i,i+300).map(r=>r.operacion);
      const {data}=await sb.from("creditos").select("operacion,estado_gestion").eq("financiera",rows[0].financiera).in("operacion",ops);
      (data||[]).forEach(d=>existentes.set(d.operacion,d.estado_gestion));
    }
    const nuevos=[], finales=[], mantener=[];
    for(const r of rows){
      const derivado=estadoCreditoDesde(r.estado_origen);
      if(!existentes.has(r.operacion)){ r.estado_gestion=derivado; nuevos.push(r); }
      else if(derivado!=="pre_aprobado"){ r.estado_gestion=derivado; finales.push(r); }
      else mantener.push(r);
    }
    grupos=[nuevos,finales,mantener].filter(g=>g.length);
    log(`  ${nuevos.length} nuevos · ${finales.length} con estado final de la financiera · ${mantener.length} se mantienen en gestión`);
  }
  let hechas=0; const total=rows.length;
  for(const g of grupos){
    for(let i=0;i<g.length;i+=400){
      const lote=g.slice(i,i+400);
      const {error}=await sb.from(F.tabla).upsert(lote,{onConflict:F.clave});
      if(error){ log(`✗ Error al guardar: ${error.message}`); return; }
      hechas+=lote.length; setProgress(hechas/total);
    }
  }
  if(sinLocal.size){
    await sb.from("local_alias").upsert([...sinLocal].map(a=>({fuente:hoja.fuente,alias:a,local_id:null})),{onConflict:"fuente,alias",ignoreDuplicates:true});
    log(`  ⚠ ${sinLocal.size} nombre(s) de local sin equivalencia: ${[...sinLocal].join(" | ")}\n    Asígnalos en Administración → Equivalencias para que los jefes de local los vean.`);
  }
  const filasSinLocal=rows.filter(r=>r.local_id==null).length;
  await sb.from("cargas").insert({fuente:hoja.fuente,archivo:file.name,filas:rows.length,sin_local:filasSinLocal,usuario_id:S.user.id});
  log(`✓ ${rows.length} registros guardados en ${F.nombre}${filasSinLocal?` (${filasSinLocal} sin local asignado)`:""}`);
}

  const drop=$("#drop"), input=$("#fileInput"), logEl=$("#log");
  const log=m=>{ logEl.textContent=(logEl.textContent==="Esperando archivos…"?"":logEl.textContent+"\n")+m; logEl.scrollTop=logEl.scrollHeight; };
  const setProgress=p=>$("#prog").style.width=Math.round(p*100)+"%";
  const procesar=async files=>{
    for(const f of files){ setProgress(0); try{ await procesarArchivo(f,log,setProgress); }catch(e){ console.error(e); log(`✗ ${f.name}: ${e.message||e}`); } }
    const {data:auto}=await sb.rpc("autoasignar_vendedores"); if(auto) log(`▸ Vendedores: ${auto.asignados} alias unificados automáticamente, ${auto.pendientes} pendientes de asignar en Administración.`);
    setProgress(1); await cargarCatalogos(); toast("Carga terminada");
  };
  drop.addEventListener("click",()=>input.click());
  input.addEventListener("change",()=>procesar([...input.files]));
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
  drop.addEventListener("drop",e=>procesar([...e.dataTransfer.files]));
};

/* =====================================================================
   ADMINISTRACIÓN
   ===================================================================== */
PAGES.admin = async function(){
  const main=$("#main");
  const [{data:perfiles},{data:ul},{data:um},{data:params}]=await Promise.all([
    sb.from("perfiles").select("*").order("nombre"), sb.from("usuario_locales").select("*"), sb.from("usuario_marcas").select("*"), sb.from("parametros").select("*").order("clave")]);
  const locDe=id=>(ul||[]).filter(x=>x.usuario_id===id).map(x=>x.local_id);
  const marDe=id=>(um||[]).filter(x=>x.usuario_id===id).map(x=>x.marca_id);
  const pendientes=S.alias.filter(a=>!a.local_id);
  const locOpts=(sel)=>`<option value="">— elegir local —</option>`+S.locales.map(l=>`<option value="${l.id}" ${sel===l.id?"selected":""}>${esc(l.nombre)}</option>`).join("");
  const marOpts=(sel)=>S.marcas.map(m=>`<option value="${m.id}" ${sel===m.id?"selected":""}>${esc(m.nombre)}</option>`).join("");

  main.innerHTML=`<div class="page-head"><h2>Administración</h2></div>

  <div class="card"><h3>Usuarios y permisos</h3>
    <p class="hint">Los usuarios se crean en Supabase → Authentication → Users → Add user (correo y contraseña, con "Auto confirm"). Al crearlos aparecen aquí para asignarles rol y locales.</p>
    <div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Locales</th><th>Marcas</th><th></th></tr></thead><tbody>
    ${(perfiles||[]).map(p=>`<tr>
      <td><input class="input" data-nombre="${p.id}" value="${esc(p.nombre||"")}" style="min-width:160px"></td><td>${esc(p.email)}</td>
      <td><select data-rol="${p.id}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${p.rol===k?"selected":""}>${v}</option>`).join("")}</select></td>
      <td>${locDe(p.id).map(id=>esc(localNombre(id))).join(", ")||"<span class='hint'>—</span>"} <button class="btn sm" data-asig-loc="${p.id}">Editar</button></td>
      <td>${marDe(p.id).map(id=>esc(marcaNombre(id))).join(", ")||"<span class='hint'>—</span>"} <button class="btn sm" data-asig-mar="${p.id}">Editar</button></td>
      <td><button class="btn sm primary" data-save-user="${p.id}">Guardar</button></td></tr>`).join("")}
    </tbody></table></div>
  </div>

  <div class="card"><h3>Equivalencias de locales ${pendientes.length?pill(pendientes.length+" pendientes","warn"):pill("al día","ok")}</h3>
    <p class="hint">Cada fuente nombra los locales a su manera. Aquí indicas a qué local real corresponde cada nombre; al guardar, se actualizan todos los registros ya cargados con ese nombre.</p>
    <div class="tablewrap"><table><thead><tr><th>Fuente</th><th>Nombre en el archivo</th><th>Local real</th><th></th></tr></thead><tbody>
    ${[...pendientes,...S.alias.filter(a=>a.local_id)].map(a=>`<tr><td>${esc(FUENTES[a.fuente]?.nombre||a.fuente)}</td><td>${esc(a.alias)}</td><td><select data-alias="${a.id}">${locOpts(a.local_id)}</select></td><td><button class="btn sm primary" data-save-alias="${a.id}">Guardar</button></td></tr>`).join("")}
    </tbody></table></div>
  </div>

  <div class="card"><h3>Locales y marcas</h3>
    <div class="row" style="margin-bottom:10px"><input class="input" id="nLocal" placeholder="Nuevo local" style="width:240px"><select id="nLocalMarca" style="width:auto">${marOpts()}</select><button class="btn" id="addLocal">Agregar local</button>
      <input class="input" id="nMarca" placeholder="Nueva marca" style="width:180px;margin-left:16px"><button class="btn" id="addMarca">Agregar marca</button>
      <input class="input" id="nFin" placeholder="Nueva financiera" style="width:180px;margin-left:16px"><button class="btn" id="addFin">Agregar financiera</button></div>
    <div class="tablewrap"><table><thead><tr><th>Local</th><th>Marca</th><th>Activo</th><th></th></tr></thead><tbody>
    ${S.locales.map(l=>`<tr><td><input class="input" data-loc-nombre="${l.id}" value="${esc(l.nombre)}" style="min-width:200px"></td><td><select data-loc-marca="${l.id}">${marOpts(l.marca_id)}</select></td><td><input type="checkbox" data-loc-activo="${l.id}" ${l.activo?"checked":""}></td><td><button class="btn sm primary" data-save-loc="${l.id}">Guardar</button></td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint" style="margin-top:8px">Financieras: ${S.financieras.map(f=>esc(f.nombre)).join(", ")}</p>
  </div>

  <div class="card"><h3>Vendedores (unificación de nombres) ${(()=>{ const n=(S.vendAlias||[]).filter(x=>!x.vendedor_id).length; return n?pill(n+" pendientes","warn"):pill("al día","ok"); })()}</h3>
    <p class="hint">El nombre oficial es el de SIGA. Cada fuente (PILOT, HDI, Santander, Forum, Autored) escribe el nombre distinto; aquí se indica a qué vendedor corresponde. Los que calzan sin duda se asignan solos; los dudosos quedan aquí.</p>
    <div class="row" style="margin-bottom:10px"><button class="btn" id="autoVend">Auto-asignar ahora</button></div>
    <div class="tablewrap"><table><thead><tr><th>Fuente</th><th>Nombre en la fuente</th><th>Vendedor oficial</th><th></th></tr></thead><tbody>
    ${(S.vendAlias||[]).filter(x=>!x.vendedor_id).sort((a,b)=>a.alias.localeCompare(b.alias)).map(x=>`<tr><td>${esc(FUENTES[x.fuente]?.nombre||x.fuente)}</td><td>${esc(x.alias)}</td>
      <td><select data-va="${x.id}"><option value="">— elegir —</option>${(S.vend||[]).map(v=>`<option value="${v.id}">${esc(v.nombre)}</option>`).join("")}</select></td>
      <td class="row"><button class="btn sm primary" data-save-va="${x.id}">Asignar</button><button class="btn sm" data-new-va="${x.id}" title="Si esta persona no vende por SIGA (no existe como vendedor oficial)">Es un vendedor nuevo</button></td></tr>`).join("")||`<tr><td colspan="4" class="hint">No hay nombres pendientes.</td></tr>`}
    </tbody></table></div>
    <details style="margin-top:10px"><summary class="hint" style="cursor:pointer">Ver vendedores oficiales y sus alias (${(S.vend||[]).length})</summary>
    <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Vendedor</th><th>RUT</th><th>Alias asignados</th></tr></thead><tbody>
    ${(S.vend||[]).map(v=>`<tr><td>${esc(v.nombre)}</td><td>${fmtRut(v.rut)}</td><td>${(S.vendAlias||[]).filter(x=>x.vendedor_id===v.id&&x.fuente!=="siga").map(x=>`${pill(x.fuente,"mute")} ${esc(x.alias)} <button class="btn sm" data-unva="${x.id}" title="Quitar este alias">×</button>`).join(" ")||"<span class='hint'>—</span>"}</td></tr>`).join("")}
    </tbody></table></div></details>
  </div>

  <div class="card"><h3>Marcas e importadores</h3>
    <p class="hint">Mapa que usa la pestaña Marcas para agrupar por importador. Las marcas que no estén aquí caen en "Otras marcas / Seminuevos".</p>
    <div class="row" style="margin-bottom:10px"><input class="input" id="nMarcaImp" placeholder="Marca (ej. PEUGEOT)" style="width:200px"><select id="nImp" style="width:auto">${IMPORTADORES.map(i=>`<option>${i}</option>`).join("")}</select><button class="btn" id="addMarcaImp">Agregar</button></div>
    <div class="tablewrap"><table><thead><tr><th>Marca</th><th>Importador</th><th class="right">Orden</th><th></th></tr></thead><tbody>
    ${(S.marcaImp||[]).map(x=>`<tr><td>${esc(x.marca)}</td><td><select data-mi-imp="${esc(x.marca)}">${IMPORTADORES.map(i=>`<option ${x.importador===i?"selected":""}>${i}</option>`).join("")}</select></td><td class="right"><input class="input" type="number" data-mi-orden="${esc(x.marca)}" value="${x.orden??100}"></td><td><button class="btn sm primary" data-save-mi="${esc(x.marca)}">Guardar</button> <button class="btn sm danger" data-del-mi="${esc(x.marca)}">Quitar</button></td></tr>`).join("")}
    </tbody></table></div>
  </div>

  <div class="card"><h3>Parámetros</h3>
    <div class="grid">${params.map(p=>`<div class="field"><label>${esc(p.descripcion||p.clave)}</label><input class="input" data-param="${esc(p.clave)}" value="${esc(p.valor)}"></div>`).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="saveParams">Guardar parámetros</button></div>
  </div>`;
  $("#saveParams").addEventListener("click",async()=>{
    const rows=[...main.querySelectorAll("[data-param]")].map(i=>({clave:i.dataset.param,valor:i.value.trim()}));
    const {error}=await sb.from("parametros").upsert(rows,{onConflict:"clave"});
    if(error) toast(error.message,true); else { toast("Parámetros guardados"); await cargarCatalogos(); }
  });

  // usuarios
  main.querySelectorAll("[data-save-user]").forEach(b=>b.addEventListener("click",async()=>{
    const id=b.dataset.saveUser; const {error}=await sb.from("perfiles").update({rol:$(`[data-rol="${id}"]`).value,nombre:txt($(`[data-nombre="${id}"]`).value)}).eq("id",id);
    toast(error?"No se pudo guardar: "+error.message:"Usuario guardado",!!error);
  }));
  const editarAsignacion=(id,tipo)=>{
    const esLoc=tipo==="loc"; const items=esLoc?S.locales:S.marcas; const actuales=new Set(esLoc?locDe(id):marDe(id));
    const m=modal(esLoc?"Locales que puede ver":"Marcas que puede ver",`<div class="grid">${items.map(i=>`<label class="check"><input type="checkbox" value="${i.id}" ${actuales.has(i.id)?"checked":""}> ${esc(i.nombre)}${esLoc?` <span class="hint">(${esc(marcaNombre(i.marca_id))})</span>`:""}</label>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn primary" id="asigOk">Guardar</button></div>`);
    $("#asigOk",m).addEventListener("click",async()=>{
      const ids=[...m.querySelectorAll("input:checked")].map(c=>+c.value); const tabla=esLoc?"usuario_locales":"usuario_marcas"; const col=esLoc?"local_id":"marca_id";
      await sb.from(tabla).delete().eq("usuario_id",id);
      if(ids.length){ const {error}=await sb.from(tabla).insert(ids.map(x=>({usuario_id:id,[col]:x}))); if(error){ toast(error.message,true); return; } }
      m.remove(); toast("Permisos guardados"); irA("admin");
    });
  };
  main.querySelectorAll("[data-asig-loc]").forEach(b=>b.addEventListener("click",()=>editarAsignacion(b.dataset.asigLoc,"loc")));
  main.querySelectorAll("[data-asig-mar]").forEach(b=>b.addEventListener("click",()=>editarAsignacion(b.dataset.asigMar,"mar")));

  // equivalencias
  main.querySelectorAll("[data-save-alias]").forEach(b=>b.addEventListener("click",async()=>{
    const a=S.alias.find(x=>x.id===+b.dataset.saveAlias); const local_id=+$(`[data-alias="${a.id}"]`).value||null;
    if(!local_id){ toast("Elige un local.",true); return; }
    let {error}=await sb.from("local_alias").update({local_id}).eq("id",a.id); if(error){ toast(error.message,true); return; }
    const F=FUENTES[a.fuente]; let q=sb.from(F.tabla).update({local_id}).eq(F.campoLocal,a.alias);
    if(F.tabla==="creditos") q=q.eq("financiera",a.fuente.toUpperCase());
    ({error}=await q); if(error){ toast("Alias guardado, pero no se pudieron actualizar los registros: "+error.message,true); return; }
    toast("Equivalencia guardada y registros actualizados"); await cargarCatalogos(); irA("admin");
  }));

  // vendedores
  $("#autoVend").addEventListener("click",async()=>{ const {data,error}=await sb.rpc("autoasignar_vendedores"); if(error) toast(error.message,true); else { toast(`${data.asignados} asignados, ${data.pendientes} pendientes`); await cargarCatalogos(); irA("admin"); } });
  main.querySelectorAll("[data-save-va]").forEach(b=>b.addEventListener("click",async()=>{ const id=+b.dataset.saveVa; const vid=+$(`[data-va="${id}"]`).value; if(!vid){ toast("Elige el vendedor oficial.",true); return; } const {error}=await sb.from("vendedor_alias").update({vendedor_id:vid}).eq("id",id); if(error) toast(error.message,true); else { toast("Alias asignado"); await cargarCatalogos(); irA("admin"); } }));
  main.querySelectorAll("[data-new-va]").forEach(b=>b.addEventListener("click",async()=>{ const {error}=await sb.rpc("crear_vendedor_desde_alias",{p_alias_id:+b.dataset.newVa}); if(error) toast(error.message,true); else { toast("Vendedor creado"); await cargarCatalogos(); irA("admin"); } }));
  main.querySelectorAll("[data-unva]").forEach(b=>b.addEventListener("click",async()=>{ const {error}=await sb.from("vendedor_alias").update({vendedor_id:null}).eq("id",+b.dataset.unva); if(error) toast(error.message,true); else { await cargarCatalogos(); irA("admin"); } }));
  // marcas e importadores
  $("#addMarcaImp").addEventListener("click",async()=>{ const marca=normMarca($("#nMarcaImp").value); if(!marca) return; const {error}=await sb.from("marca_importador").upsert({marca,importador:$("#nImp").value},{onConflict:"marca"}); if(error) toast(error.message,true); else { await cargarCatalogos(); irA("admin"); } });
  main.querySelectorAll("[data-save-mi]").forEach(b=>b.addEventListener("click",async()=>{ const m=b.dataset.saveMi; const {error}=await sb.from("marca_importador").update({importador:$(`[data-mi-imp="${m}"]`).value,orden:+$(`[data-mi-orden="${m}"]`).value||100}).eq("marca",m); if(error) toast(error.message,true); else { toast("Guardado"); await cargarCatalogos(); } }));
  main.querySelectorAll("[data-del-mi]").forEach(b=>b.addEventListener("click",async()=>{ if(!confirm(`¿Quitar ${b.dataset.delMi} del mapa?`)) return; const {error}=await sb.from("marca_importador").delete().eq("marca",b.dataset.delMi); if(error) toast(error.message,true); else { await cargarCatalogos(); irA("admin"); } }));
  // locales / marcas / financieras
  $("#addLocal").addEventListener("click",async()=>{ const nombre=txt($("#nLocal").value); if(!nombre) return; const {error}=await sb.from("locales").insert({nombre,marca_id:+$("#nLocalMarca").value}); if(error) toast(error.message,true); else { await cargarCatalogos(); irA("admin"); } });
  $("#addMarca").addEventListener("click",async()=>{ const nombre=txt($("#nMarca").value)?.toUpperCase(); if(!nombre) return; const {error}=await sb.from("marcas").insert({nombre}); if(error) toast(error.message,true); else { await cargarCatalogos(); irA("admin"); } });
  $("#addFin").addEventListener("click",async()=>{ const nombre=txt($("#nFin").value)?.toUpperCase(); if(!nombre) return; const {error}=await sb.from("financieras").insert({nombre}); if(error) toast(error.message,true); else { await cargarCatalogos(); irA("admin"); } });
  main.querySelectorAll("[data-save-loc]").forEach(b=>b.addEventListener("click",async()=>{
    const id=+b.dataset.saveLoc; const {error}=await sb.from("locales").update({nombre:txt($(`[data-loc-nombre="${id}"]`).value),marca_id:+$(`[data-loc-marca="${id}"]`).value,activo:$(`[data-loc-activo="${id}"]`).checked}).eq("id",id);
    if(error) toast(error.message,true); else { toast("Local guardado"); await cargarCatalogos(); }
  }));
};
</script>

<script>
/* =====================================================================
   PENDIENTES DE GESTIÓN
   ===================================================================== */
PAGES.pendientes = async function(){
  const main=$("#main");
  const diasCred=+S.param.dias_sin_gestion||7, diasSeg=+S.param.dias_venta_sin_seguro||30;
  main.innerHTML=`<div class="page-head"><h2>Pendientes de gestión</h2><span class="hint">Créditos pre aprobados sin seguimiento hace ≥ ${diasCred} días · ventas sin seguro en ${diasSeg} días · proyecciones de esta semana y la anterior</span></div>
    ${filtrosHtml({fechas:false,buscar:false})}<div id="pend"></div>`;
  const run=async()=>{
    $("#pend").innerHTML=`<div class="empty">Revisando…</div>`;
    const limite=isoDate(addDays(new Date(),-diasCred));
    const desdeSeg=isoDate(addDays(new Date(),-diasSeg));
    const semAct=isoDate(lunes(new Date())), semAnt=isoDate(addDays(lunes(new Date()),-7));
    let [cred,proy,vss]=await Promise.all([
      fetchAll(()=>aplicarFiltroLocal(sb.from("creditos").select("*").eq("estado_gestion","pre_aprobado").is("seguimiento",null).lt("fecha_solicitud",limite).order("fecha_solicitud"))),
      fetchAll(()=>aplicarFiltroLocal(sb.from("v_proyecciones").select("*").eq("estado","proyectada").in("semana",[semAct,semAnt]).order("semana").order("local_nombre"))),
      fetchAll(()=>aplicarFiltroLocal(sb.from("v_ventas_sin_seguro").select("*").gte("fecha",desdeSeg).order("fecha",{ascending:false}))),
    ]);
    const fm=filtroMarca(); cred=cred.filter(fm); vss=vss.filter(fm);
    const proyPend=proy.filter(fm).filter(p=>!p.credito_operacion||!p.seguro_propuesta||(p.retoma&&!p.tasacion_id));
    $("#fCount").textContent=`${cred.length+proyPend.length+vss.length} pendientes`;
    const dias=d=>Math.floor((Date.now()-new Date(d+"T12:00:00"))/864e5);
    const colsC=[
      {h:"Días sin gestión",right:true,f:r=>pill(dias(r.fecha_solicitud)+" d",dias(r.fecha_solicitud)>=diasCred*2?"bad":"warn")},
      {h:"Operación",f:r=>esc(r.operacion)},{h:"Financiera",f:r=>esc(r.financiera)},{h:"Cliente",f:r=>esc(r.nombre_cliente)},{h:"RUT",f:r=>fmtRut(r.rut)},
      {h:"Local",f:r=>esc(localNombre(r.local_id)||r.dealer_origen)},{h:"Vendedor",f:r=>esc(r.vendedor)},{h:"Modelo",f:r=>esc(r.modelo)},{h:"Fecha solicitud",f:r=>fmtDate(r.fecha_solicitud)},
      {h:"Estado financiera",f:r=>estadoPill(r.estado_origen)},
      {h:"Seguimiento 1",f:r=>puedeGestionar()?`<select data-pseg="${r.id}"><option value="">— registrar —</option>${SEGUIMIENTOS.map(x=>`<option>${x}</option>`).join("")}</select>`:""},
      {h:"Cambiar estado",f:r=>puedeGestionar()?`<select data-est="${r.id}">${Object.entries(ESTADOS_CREDITO).map(([k,v])=>`<option value="${k}" ${r.estado_gestion===k?"selected":""}>${v}</option>`).join("")}</select>`:""},
    ];
    const colsP=[
      {h:"Semana",f:r=>fmtDate(r.semana)},{h:"Local",f:r=>esc(r.local_nombre)},{h:"Vendedor",f:r=>esc(r.vendedor)},{h:"Cliente",f:r=>esc(r.nombre_cliente)},{h:"RUT",f:r=>fmtRut(r.rut_cliente)},{h:"Marca",f:r=>esc(r.marca)},
      {h:"Falta",f:r=>[!r.credito_operacion?pill("Sin crédito","warn"):"",!r.seguro_propuesta?pill("Sin seguro","warn"):"",r.retoma&&!r.tasacion_id?pill("Retoma sin tasación","bad"):""].filter(Boolean).join(" ")},
    ];
    const colsV=[
      {h:"Fecha",f:r=>fmtDate(r.fecha)},{h:"N° venta",f:r=>esc(r.nota_venta)},{h:"Local",f:r=>esc(localNombre(r.local_id))},{h:"Vendedor",f:r=>esc(r.vendedor)},{h:"Cliente",f:r=>esc(r.cliente)},{h:"RUT",f:r=>fmtRut(r.rut)},{h:"Marca",f:r=>esc(r.marca)},{h:"Modelo",f:r=>esc(r.modelo)},
    ];
    $("#pend").innerHTML=`
      <div class="card"><h3>Créditos pre aprobados sin seguimiento ${pill(cred.length,cred.length?"warn":"ok")}</h3>${tabla(colsC,cred)}</div>
      <div class="card"><h3>Proyecciones con cruce incompleto ${pill(proyPend.length,proyPend.length?"warn":"ok")}</h3>${tabla(colsP,proyPend)}</div>
      <div class="card"><h3>Ventas sin seguro registrado ${pill(vss.length,vss.length?"warn":"ok")}</h3><p class="hint">Ventas de SIGA sin institución de seguro y sin propuesta HDI para ese RUT en los 30 días previos.</p>${tabla(colsV,vss)}</div>`;
    S.exp={cols:colsC,rows:cred};
    main.querySelectorAll("[data-est]").forEach(s=>s.addEventListener("change",async()=>{
      const {error}=await sb.from("creditos").update({estado_gestion:s.value}).eq("id",+s.dataset.est);
      if(error) toast(error.message,true); else { toast("Estado actualizado a "+ESTADOS_CREDITO[s.value]); run(); }
    }));
    main.querySelectorAll("[data-pseg]").forEach(s=>s.addEventListener("change",async()=>{ if(!s.value) return;
      const {error}=await sb.from("creditos").update({seguimiento:s.value}).eq("id",+s.dataset.pseg);
      if(error) toast(error.message,true); else { toast("Seguimiento registrado"); run(); }
    }));
  };
  bindFiltros(run); bindExcel("Pendientes_creditos",()=>S.exp); await run();
};

/* =====================================================================
   VENDEDORES
   ===================================================================== */
PAGES.vendedores = async function(){
  $("#main").innerHTML=`<div class="page-head"><h2>Vendedores</h2></div>${filtrosHtml({buscar:false})}<div id="tbl"></div>`;
  const run=async()=>{
    $("#tbl").innerHTML=`<div class="empty">Calculando…</div>`;
    const d=S.filtro.desde,h=S.filtro.hasta, prev=periodoAnterior(d,h);
    let [ventas,proy,ventasAnt]=await Promise.all([
      fetchAll(()=>aplicarFiltroLocal(sb.from("ventas").select("vendedor,nota_venta,local_id,marca,es_usado,resultado_negocio,nula,fecha_facturacion,institucion_credito,institucion_seguro,retoma,patente_retoma,canal").gte("fecha",d).lte("fecha",h))),

    const LA=cruceLeadsVentas(ventas.filter(esValida),leadsCur), LB=cruceLeadsVentas(ventasAnt.filter(esValida),leadsAnt);
    const mA=rs=>{ const v=rs.filter(esValida); return {vend:new Set(v.map(x=>String(x.vendedor||"").trim().toUpperCase()).filter(Boolean)).size,n:v.length,nulas:rs.length-v.length,monto:v.reduce((a,r)=>a+resNeg(r),0)}; };
    const A=mA(ventas),B=mA(ventasAnt);
    const resumen=resumenHtml([{l:"Vendedores con ventas",v:A.vend,p:B.vend,g:"ventas"},{l:"Ventas válidas",v:A.n,p:B.n,g:"ventas"},{l:"Nulas",v:A.nulas,p:B.nulas,g:"ventas"},{l:"Resultado negocio (facturadas)",v:A.monto,p:B.monto,money:true,g:"ventas"},{l:"Promedio por vendedor",v:A.vend?Math.round(A.n/A.vend*10)/10:0,p:B.vend?Math.round(B.n/B.vend*10)/10:0,g:"ventas"},...itemsLeads(LA,LB)],etiquetaPrev(prev));
    const agg={}; const key=v=>vendedorCanon("siga",v);
    const nuevo=k=>({vendedor:k,locales:new Set(),marcas:{},ventas:0,nulas:0,fact:0,monto:0,cred:0,seg:0,ret:0,web:0,proy:0,proyOk:0,leads:0,leadsSol:0,ventasLead:0,segHdi:0,segProp:0,solic:0,cursados:0,tas:0});
    const get=k=>agg[k]||(agg[k]=nuevo(k));
    const getM=(k,reg)=>{ const r=get(k); const mk=marcaReg(reg); return r.marcas[mk]||(r.marcas[mk]=nuevo(mk)); };
    const notasLead=new Set(leadsCur.map(l=>l.venta_nota).filter(Boolean));
    leadsCur.forEach(l=>{ const k=vendedorCanon("pilot",l.asignado_a); for(const r of [get(k),getM(k,l)]){ r.leads++; if(l.credito_id) r.leadsSol++; } });
    segHdi.forEach(x=>{ const k=vendedorCanon("hdi",x.nombre_vendedor,x.rut_vendedor); for(const r of [get(k),getM(k,x)]){ r.segProp++; if(/^activ/i.test(x.estado_emision||"")) r.segHdi++; } });
    credV.forEach(x=>{ const k=vendedorCanon(x.financiera==="FORUM"?"forum":"santander",x.vendedor); for(const r of [get(k),getM(k,x)]){ r.solic++; if(x.estado_gestion==="cursado") r.cursados++; } });
    tasV.forEach(x=>{ get(vendedorCanon("autored",x.vendedor)).tas++; });
    ventas.forEach(v=>{ const k=key(v.vendedor); const r0=get(k); r0.locales.add(v.local_id); for(const r of [r0,getM(k,v)]){ if(v.nula){ r.nulas++; continue; } r.ventas++; r.monto+=resNeg(v); if(v.fecha_facturacion) r.fact++; if(notasLead.has(v.nota_venta)) r.ventasLead++; if(v.institucion_credito) r.cred++; if(v.institucion_seguro) r.seg++; if(v.retoma||v.patente_retoma) r.ret++; if(v.canal==="web") r.web++; } });
    proy.forEach(p=>{ const r=get(key(p.vendedor)); r.locales.add(p.local_id); r.proy++; if(p.estado==="concretada") r.proyOk++; });
    const rows=Object.values(agg).filter(r=>r.ventas||r.nulas||r.proy||r.leads||r.segHdi||r.solic||r.tas).sort((a,b)=>b.ventas-a.ventas||b.monto-a.monto); rows.forEach((r,i)=>r.rank=i+1);
    $("#fCount").textContent=`${rows.length} vendedores`;
    const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
    const cols=[
      {h:"#",right:true,f:r=>r.rank??""},{h:"Vendedor",f:r=>esc(r.vendedor)},{h:"Local",f:r=>[...r.locales].map(id=>esc(localNombre(id))).filter(Boolean).join(", ")},{h:"Marcas",f:r=>Object.keys(r.marcas||{}).join(", ")},
      {h:"Ventas",right:true,f:r=>fmtNum(r.ventas)},{h:"Nulas",right:true,f:r=>fmtNum(r.nulas)},{h:"Facturadas",right:true,f:r=>fmtNum(r.fact)},{h:"Resultado facturado",right:true,f:r=>fmtMoney(r.monto)},
      {h:"Solicitudes crédito",right:true,f:r=>fmtNum(r.solic)},{h:"Cursados",right:true,f:r=>`${fmtNum(r.cursados)} (${pct(r.cursados,r.ventas)})`},
      {h:"Seguros HDI activos",right:true,f:r=>`${fmtNum(r.segHdi)} (${pct(r.segHdi,r.ventas)})`},{h:"Tasaciones",right:true,f:r=>fmtNum(r.tas)},
      {h:"Retomas",right:true,f:r=>fmtNum(r.ret)},{h:"Web",right:true,f:r=>fmtNum(r.web)},
      {h:"Proyectado",right:true,f:r=>`${fmtNum(r.proyOk)}/${fmtNum(r.proy)}`},{h:"Cumpl.",right:true,f:r=>pct(r.proyOk,r.proy)},
      {h:"Leads asignados",right:true,f:r=>fmtNum(r.leads)},{h:"SOL-COT",right:true,f:r=>pct(r.leadsSol,r.leads)},{h:"Ventas desde lead",right:true,f:r=>fmtNum(r.ventasLead)},{h:"Cierre",right:true,f:r=>pct(r.ventasLead,r.leads)},{h:"Leads por venta",right:true,f:r=>r.ventasLead?fmtNum(Math.round(r.leads/r.ventasLead*10)/10):"—"},
    ];
    const sinUnif=rows.filter(r=>/\(sin unificar\)/.test(r.vendedor)).length;
    const subsV=r=>Object.values(r.marcas||{}).map(x=>({...x,vendedor:x.vendedor,locales:new Set()})).sort((a,b)=>b.ventas-a.ventas||b.leads-a.leads);
    $("#tbl").innerHTML=resumen+`<p class="hint" style="margin-bottom:8px">Ventas, leads, créditos, seguros y tasaciones se unen por el maestro de vendedores (nombre oficial de SIGA). ▸ abre el desglose por marca.${sinUnif?` <strong>${sinUnif} nombre(s) sin unificar</strong>: asígnalos en Administración → Vendedores.`:""}</p>`+tablaExp(cols,rows,subsV); S.exp={cols,rows}; bindExp($("#tbl"));
  };
  bindFiltros(run); bindExcel("Vendedores",()=>S.exp); await run();
};

PAGES.metas = async function(){

  const leerM=async(a,m)=>{ const {data}=await sb.from("metas_marca").select("*").eq("anio",a).eq("mes",m); return Object.fromEntries((data||[]).map(x=>[x.marca,x])); };
  const inp=(f,v,max)=>`<td class="right"><input class="input" type="number" min="0" ${max?`max="${max}"`:""} data-f="${f}" value="${v??0}"></td>`;
  const run=async()=>{
    anio=+$("#mAnio").value; mes=+$("#mMes").value;
    if(modo==="local"){
      $("#mHint").textContent="Meta de ventas en unidades; metas de crédito y seguro como % de las ventas del mes. Déjalas en 0 si un local no tiene meta.";
      const actuales=await leer(anio,mes); const locs=S.locales.filter(l=>l.activo);
      $("#tbl").innerHTML=`<div class="tablewrap"><table><thead><tr><th>Local</th><th>Marca</th><th class="right">Meta ventas</th><th class="right">% crédito</th><th class="right">% seguro</th></tr></thead><tbody>
        ${locs.map(l=>{ const m=actuales[l.id]||{}; return `<tr data-loc="${l.id}"><td>${esc(l.nombre)}</td><td>${esc(marcaNombre(l.marca_id))}</td>${inp("meta_ventas",m.meta_ventas)}${inp("meta_pct_credito",m.meta_pct_credito,100)}${inp("meta_pct_seguro",m.meta_pct_seguro,100)}</tr>`; }).join("")}
        </tbody></table></div>`;
    } else {
      $("#mHint").textContent="Metas por marca de vehículo, agrupadas por importador: ventas en unidades; crédito y seguro como % de ventas; CI y MPP como % de los créditos cursados. Es lo que alimenta la pestaña Marcas.";
      const actuales=await leerM(anio,mes); const marcas=(S.marcaImp||[]).slice().sort((a,b)=>IMPORTADORES.indexOf(a.importador)-IMPORTADORES.indexOf(b.importador)||a.orden-b.orden);
      $("#tbl").innerHTML=`<div class="tablewrap"><table><thead><tr><th>Importador</th><th>Marca</th><th class="right">Meta ventas</th><th class="right">% crédito</th><th class="right">% CI</th><th class="right">% MPP</th><th class="right">% seguro</th></tr></thead><tbody>
        ${marcas.map(x=>{ const m=actuales[x.marca]||{}; return `<tr data-marca="${esc(x.marca)}"><td>${esc(x.importador)}</td><td>${esc(x.marca)}</td>${inp("meta_ventas",m.meta_ventas)}${inp("pct_credito",m.pct_credito,100)}${inp("pct_ci",m.pct_ci,100)}${inp("pct_mpp",m.pct_mpp,100)}${inp("pct_seguro",m.pct_seguro,100)}</tr>`; }).join("")}
        </tbody></table></div>${marcas.length?"":`<p class="hint">No hay marcas en el mapa de importadores. Agrégalas en Administración → Marcas e importadores.</p>`}`;
    }
  };
  main.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; modo=b.dataset.modo; main.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b)); run(); });
  const leerFila=tr=>{ const o={}; tr.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=+i.value||0); return o; };
  $("#mGuardar").addEventListener("click",async()=>{
    let error;
    if(modo==="local"){ const rows=[...main.querySelectorAll("tr[data-loc]")].map(tr=>({local_id:+tr.dataset.loc,anio,mes,...leerFila(tr),actualizado_en:new Date().toISOString()})); ({error}=await sb.from("metas").upsert(rows,{onConflict:"local_id,anio,mes"})); }
    else { const rows=[...main.querySelectorAll("tr[data-marca]")].map(tr=>({marca:tr.dataset.marca,anio,mes,...leerFila(tr),actualizado_en:new Date().toISOString()})); if(!rows.length) return; ({error}=await sb.from("metas_marca").upsert(rows,{onConflict:"marca,anio,mes"})); }
    toast(error?"No se pudo guardar: "+error.message:`Metas de ${MESES[mes-1]} ${anio} guardadas`,!!error);
  });
  $("#mCopiar").addEventListener("click",async()=>{
    const pa=mes===1?anio-1:anio, pm=mes===1?12:mes-1;
    const prev= modo==="local" ? await leer(pa,pm) : await leerM(pa,pm);
    if(!Object.keys(prev).length){ toast(`No hay metas en ${MESES[pm-1]} ${pa}.`,true); return; }
    main.querySelectorAll(modo==="local"?"tr[data-loc]":"tr[data-marca]").forEach(tr=>{ const m=prev[modo==="local"?+tr.dataset.loc:tr.dataset.marca]; if(!m) return; tr.querySelectorAll("[data-f]").forEach(i=>{ if(m[i.dataset.f]!=null) i.value=m[i.dataset.f]; }); });
    toast("Copiadas; revisa y pulsa Guardar todo");
  });
  $("#mMes").addEventListener("change",run); $("#mAnio").addEventListener("change",run);
  await run();
};

async function renderHistorico(cont){
  const n=+S.param.semanas_historico||12; const desde=isoDate(addDays(lunes(new Date()),-7*(n-1)));
  const locSel=S.filtro.local;
  cont.innerHTML=`<div class="filters"><select id="hLocal"><option value="">Todos mis locales</option>${S.misLocales.map(l=>`<option value="${l.id}" ${String(l.id)===String(locSel)?"selected":""}>${esc(l.nombre)}</option>`).join("")}</select><span class="count">Últimas ${n} semanas</span></div><div id="hBody" class="empty">Cargando…</div>`;
  const run=async()=>{
    S.filtro.local=$("#hLocal").value;
    const rows=await fetchAll(()=>aplicarFiltroLocal(sb.from("v_proyecciones_semana").select("*").gte("semana",desde).order("semana")));
    const porSem={}; rows.forEach(r=>{ const s=porSem[r.semana]||(porSem[r.semana]={semana:r.semana,proy:0,ok:0,caidas:0,web:0,ret:0,locales:0}); s.proy+=+r.proyectadas; s.ok+=+r.concretadas; s.caidas+=+r.caidas; s.web+=+r.web; s.ret+=+r.con_retoma; s.locales++; });
    const sems=Object.values(porSem).sort((a,b)=>a.semana<b.semana?-1:1);
    if(!sems.length){ $("#hBody").innerHTML=`<div class="empty">Aún no hay proyecciones en este período.</div>`; return; }
    const pct=(a,b)=>b?Math.round(a/b*100):0;
    const bars=`<div class="card"><h3>Cumplimiento por semana (% concretadas)</h3><div class="bars">${sems.map(s=>`<div class="bar"><b>${pct(s.ok,s.proy)}%</b><i style="height:${pct(s.ok,s.proy)}%"></i><span>${fmtDate(s.semana).slice(0,5)}</span></div>`).join("")}</div></div>`;
    const cols=[{h:"Semana del",f:r=>fmtDate(r.semana)},{h:"Locales",right:true,f:r=>r.locales},{h:"Proyectadas",right:true,f:r=>r.proy},{h:"Concretadas",right:true,f:r=>r.ok},{h:"Caídas",right:true,f:r=>r.caidas},{h:"Web",right:true,f:r=>r.web},{h:"Con retoma",right:true,f:r=>r.ret},{h:"Cumplimiento",right:true,f:r=>pill(pct(r.ok,r.proy)+"%",pct(r.ok,r.proy)>=70?"ok":pct(r.ok,r.proy)>=40?"warn":"bad")}];
    const T=sems.reduce((a,s)=>({proy:a.proy+s.proy,ok:a.ok+s.ok}),{proy:0,ok:0});
    $("#hBody").classList.remove("empty");
    $("#hBody").innerHTML=bars+`<div class="row" style="margin-bottom:8px">${puedeExportar()?`<button class="btn sm" id="hExcel">Exportar Excel</button>`:""}<span class="hint">Total período: ${T.ok}/${T.proy} concretadas (${pct(T.ok,T.proy)}%)</span></div>`+tabla(cols,sems);
    $("#hExcel")?.addEventListener("click",()=>exportarExcel("Historico_proyecciones",cols,sems));
  };
  $("#hLocal").addEventListener("change",run); await run();
}

const IMPORTADORES=["ASTARA","STELLANTIS","GEELY","OTROS"];
function normMarca(m){
  if(!m) return null;
  let s=String(m).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim();
  if(!s) return null;
  if(/^SSANGYONG/.test(s)) s="KGM";
  if(/^LEAP/.test(s)) s="LEAP MOTOR";
  if(/^RAM/.test(s)) s="RAM";
  if(/^CITROEN/.test(s)) s="CITROEN";
  if(/^MITSUBISHI/.test(s)) s="MITSUBISHI";
  if(/^CHERY/.test(s)) s="CHERY";
  if(/^KIA/.test(s)) s="KIA";
  if(/^MERCEDES/.test(s)) s="MERCEDES BENZ";
  if(/^GEELY/.test(s)) s="GEELY";
  return s;
}
function importadorDe(marca){ const m=(S.marcaImp||[]).find(x=>x.marca===marca); return m?m.importador:"OTROS"; }
const esRefinanciamiento=p=>/REFINANC/i.test(p||"");
const esCI=p=>/INTELIGENTE|BLACK 50|^CI\b/i.test(p||"");

/* Velocímetro SVG: valor 0-1 (o más), meta 0-1 */
function gaugeSvg(valor, meta, etiqueta, sub, grupo){
  const v=Math.max(0,Math.min(valor==null?0:valor,1.5)); const max=Math.max(1,meta?meta*1.25:1,1); const frac=Math.min(Math.max(v/max,0.001),0.999);
  const color=valor==null?"#CAC59D":meta?(v>=meta?"#2e7d4f":v>=meta*0.7?"#a9731a":"#9D202F"):"#9D202F";
  const cx=75,cy=72,r=58, a0=Math.PI, a1=Math.PI-Math.PI*frac;
  const px=cx+r*Math.cos(a1), py=cy-r*Math.sin(a1);
  const arc=`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${px.toFixed(1)} ${py.toFixed(1)}`;
  const nx=cx+(r-14)*Math.cos(a1), ny=cy-(r-14)*Math.sin(a1);
  let metaMark=""; if(meta){ const fm=Math.min(meta/max,1), am=Math.PI-Math.PI*fm; const mx1=cx+(r-9)*Math.cos(am), my1=cy-(r-9)*Math.sin(am), mx2=cx+(r+6)*Math.cos(am), my2=cy-(r+6)*Math.sin(am); metaMark=`<line x1="${mx1.toFixed(1)}" y1="${my1.toFixed(1)}" x2="${mx2.toFixed(1)}" y2="${my2.toFixed(1)}" stroke="#1E1E1E" stroke-width="2.5"/>`; }
  return `<div class="gauge ${grupo?"g-"+grupo:""}" style="border-top:4px solid var(--gc,var(--line))"><svg viewBox="0 0 150 86" role="img" aria-label="${esc(etiqueta)}">
    <path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="#ebe7d6" stroke-width="12" stroke-linecap="round"/>
    ${frac>0?`<path d="${arc}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"/>`:""}
    ${metaMark}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#1E1E1E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#1E1E1E"/>
  </svg><div class="gv">${valor==null?"—":Math.round(valor*100)+"%"}</div><div class="gl">${esc(etiqueta)}</div><div class="gs">${esc(sub||"")}</div></div>`;
}
