    // Clasificación nuevo/usado de créditos y seguros: por la venta de SIGA (operación, propuesta o RUT) o por lo que diga la financiera
    const vUs=ventas.filter(v=>v.es_usado), vNu=ventas.filter(v=>!v.es_usado);
    const opsUs=new Set(vUs.map(v=>String(v.n_operacion||"").replace(/\D/g,"")).filter(Boolean)), rutUs=new Set(vUs.map(v=>v.rut).filter(Boolean)), propUs=new Set(vUs.map(v=>String(v.n_propuesta||"").replace(/\D/g,"")).filter(Boolean));
    const rutNu=new Set(vNu.map(v=>v.rut).filter(Boolean));
    // 1º lo que declara la financiera/aseguradora; si no lo dice, el cruce con la venta de SIGA
    const estadoUsado=e=>/USADO|SEMI/i.test(e||"")?true:/NUEVO/i.test(e||"")?false:null;
    const esUsadoCred=c=>{ const e=estadoUsado(c.estado_vehiculo); if(e!==null) return e; return opsUs.has(String(c.operacion||"").replace(/\D/g,""))||(rutUs.has(c.rut)&&!rutNu.has(c.rut)); };
    const esUsadoSeg=s=>{ const e=estadoUsado(s.estado_vh); if(e!==null) return e; return propUs.has(String(s.propuesta_nro||""))||(rutUs.has(s.rut_asegurado)&&!rutNu.has(s.rut_asegurado)); };
    const ventasMes=ventas.filter(v=>v.fecha>=d&&(marcaReg(v)==="SEMINUEVOS")===usados);
    let metaUsados=null;
    (metas||[]).forEach(mt=>{ const mk=normMarca(mt.marca); if(mk==="USADOS"){ metaUsados=mt; return; } if(!usados){ const r=get(mk); r.meta=mt.meta_ventas||0; r.pcCred=+mt.pct_credito||0; r.pcCI=+mt.pct_ci||0; r.pcMPP=+mt.pct_mpp||0; r.pcSeg=+mt.pct_seguro||0; } });
    ventasMes.forEach(v=>{ const m=normMarca(v.marca); for(const r of [get(m),getL(m,v.local_id)]){ if(v.nula){ r.nulas++; continue; } r.ventas++; r.monto+=resNeg(v); if(v.fecha_facturacion) r.fact++; } });
    creditos.forEach(c=>{ if(esRefinanciamiento(c.producto)||esUsadoCred(c)!==usados) return; const m=normMarca(c.marca); for(const r of [get(m),getL(m,c.local_id)]){ r.credTot++; if(c.estado_gestion==="cursado"){ r.cred++; if(esCI(c.producto)) r.ci++; if(c.tipo_mpp) r.mpp++; } } });
    seguros.forEach(s=>{ if(esUsadoSeg(s)!==usados) return; if(/^activ/i.test(s.estado_emision||"")){ const m=normMarca(s.marca); get(m).seg++; getL(m,s.local_id).seg++; } });
    const leadUsado=l=>/SEMI|USAD/i.test(l.tipo_negocio||"");
    leads.forEach(l=>{ if(leadUsado(l)!==usados) return; const m=usados?"SEMINUEVOS (leads)":normMarca(l.tipo_negocio); for(const r of [get(m),getL(m,l.local_id)]){ r.leads++; if(l.credito_id) r.leadsSol++; if(l.venta_nota) r.ventasLead++; } });
    let rows=Object.values(agg).filter(r=>r.meta||r.ventas||r.nulas||r.cred||r.credTot||r.seg||r.leads);
    if(usados&&metaUsados&&rows[0]){ rows[0].meta=metaUsados.meta_ventas||0; rows[0].pcCred=+metaUsados.pct_credito||0; rows[0].pcSeg=+metaUsados.pct_seguro||0; }
    rows.forEach(r=>{ r.imp=importadorDe(r.marca); r.orden=(S.marcaImp||[]).find(x=>x.marca===r.marca)?.orden??999; });
    rows.sort((a,b)=>IMPORTADORES.indexOf(a.imp)-IMPORTADORES.indexOf(b.imp)||a.orden-b.orden||a.marca.localeCompare(b.marca));
    if(imp) rows=rows.filter(r=>r.imp===imp);

    const suma=rs=>{ const t={marca:"",meta:0,ventas:0,nulas:0,fact:0,monto:0,cred:0,credTot:0,ci:0,mpp:0,seg:0,leads:0,leadsSol:0,ventasLead:0,pcCred:0,pcCI:0,pcMPP:0,pcSeg:0,n:0};
      rs.forEach(r=>{ for(const k of ["meta","ventas","nulas","fact","monto","cred","credTot","ci","mpp","seg","leads","leadsSol","ventasLead"]) t[k]+=r[k]; if(r.pcCred||r.pcCI||r.pcMPP||r.pcSeg){ t.pcCred+=r.pcCred; t.pcCI+=r.pcCI; t.pcMPP+=r.pcMPP; t.pcSeg+=r.pcSeg; t.n++; } });
      if(t.n){ t.pcCred/=t.n; t.pcCI/=t.n; t.pcMPP/=t.n; t.pcSeg/=t.n; } return t; };
    const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
    const ratio=(a,b)=>b?a/b:null;
    const falta=(objetivo,real)=>{ const f=Math.ceil(objetivo)-real; return f>0?fmtNum(f):pill("OK","ok"); };
    const cell=(real,base,metaPct,color)=>{ if(!base) return "—"; const p=real/base*100; const k=metaPct?(p>=metaPct?"ok":p>=metaPct*0.7?"warn":"bad"):"mute"; return `<span class="bar" style="display:block;background-image:linear-gradient(90deg,${color||"#e8e3d0"}33 ${Math.min(p,100)}%,transparent ${Math.min(p,100)}%);margin:-8px -10px;padding:8px 10px;text-align:right">${pill(Math.round(p)+"%",k)}</span>`; };
    const colsAll=[
      {h:"Marca",f:r=>esc(r.marca)},
      {h:"Meta",right:true,f:r=>r.meta?fmtNum(r.meta):"—"},{h:"Ventas",right:true,f:r=>fmtNum(r.ventas)},{h:"Nulas",right:true,f:r=>fmtNum(r.nulas)},{h:"Facturadas",right:true,f:r=>fmtNum(r.fact)},{h:"Resultado facturado",right:true,f:r=>fmtMoney(r.monto)},
      {h:"Cumpl.",right:true,f:r=>r.meta?cell(r.ventas,r.meta,100,"#AC74D6"):"—"},{h:"Falta",right:true,f:r=>r.meta?falta(r.meta,r.ventas):"—"},
      {h:"Créditos",right:true,f:r=>fmtNum(r.cred)},{h:"Penetr.",right:true,f:r=>cell(r.cred,r.ventas,r.pcCred,"#C00000")},{h:"Falta",right:true,f:r=>r.pcCred&&r.ventas?falta(r.ventas*r.pcCred/100,r.cred):"—"},
      {h:"CI",right:true,g:"ci",f:r=>fmtNum(r.ci)},{h:"Penetr.",right:true,g:"ci",f:r=>cell(r.ci,r.cred,r.pcCI,"#FFC000")},
      {h:"MPP",right:true,g:"mpp",f:r=>fmtNum(r.mpp)},{h:"Penetr.",right:true,g:"mpp",f:r=>cell(r.mpp,r.cred,r.pcMPP,"#00B0F0")},
      {h:"Seguros",right:true,f:r=>fmtNum(r.seg)},{h:"Penetr.",right:true,f:r=>cell(r.seg,r.ventas,r.pcSeg,"#00B050")},{h:"Falta",right:true,f:r=>r.pcSeg&&r.ventas?falta(r.ventas*r.pcSeg/100,r.seg):"—"},
      {h:"Leads",right:true,f:r=>fmtNum(r.leads)},{h:"SOL-COT",right:true,f:r=>cell(r.leadsSol,r.leads,null,"#199F9C")},{h:"Ventas lead",right:true,f:r=>fmtNum(r.ventasLead)},{h:"Cierre",right:true,f:r=>cell(r.ventasLead,r.leads,null,"#199F9C")},
    ];
    const cols=usados?colsAll.filter(c=>!c.g):colsAll;
    const grupos=`<tr><th class="grp"></th><th class="grp g-ventas" colspan="7">VENTAS</th><th class="grp g-creditos" colspan="3">CRÉDITOS</th>${usados?"":`<th class="grp g-ci" colspan="2">COMPRA INTELIGENTE</th><th class="grp g-mpp" colspan="2">MPP</th>`}<th class="grp g-seguros" colspan="3">SEGUROS</th><th class="grp g-leads" colspan="4">LEADS PILOT</th></tr>`;
    const tablaImp=(rs,nombreTotal)=>{
      const T=suma(rs);
      const th=cols.map(c=>`<th class="${c.right?"right":""}">${esc(c.h)}</th>`).join("");
      const subsDe=r=>Object.values(porLocal[r.marca]||{}).filter(x=>x.ventas||x.nulas||x.cred||x.seg||x.leads).sort((a,b)=>b.ventas-a.ventas||b.cred-a.cred||b.leads-a.leads);
      const body=rs.map((r,i)=>{ const subs=subsDe(r); const key=r.marca.replace(/\W/g,"_");
        return `<tr>${cols.map((c,j)=>`<td class="${c.right?"right num":""}">${j===0&&subs.length?`<button class="exp" data-exp="${key}" title="Locales con datos de esta marca">▸</button>`:""}${c.f(r)}</td>`).join("")}</tr>`+
          subs.map(x=>`<tr class="sub hidden" data-sub="${key}">${cols.map((c,j)=>`<td class="${c.right?"right num":""}">${j===0?"↳ ":""}${c.f(x)}</td>`).join("")}</tr>`).join(""); }).join("");
      const tot=`<tr class="total">${cols.map((c,i)=>`<td class="${c.right?"right num":""}">${i===0?esc(nombreTotal):c.f(T)}</td>`).join("")}</tr>`;
      return `<div class="tablewrap"><table><thead>${grupos}<tr>${th}</tr></thead><tbody>${body}${tot}</tbody></table></div>`;
    };
    const gauges=(T)=>`<div class="gauges">
      ${gaugeSvg(ratio(T.ventas,T.meta),1,"Cumplimiento ventas",T.meta?`${fmtNum(T.ventas)} de ${fmtNum(T.meta)}`:`${fmtNum(T.ventas)} ventas · sin meta`,"ventas")}
      ${gaugeSvg(ratio(T.cred,T.ventas),T.pcCred/100,"Penetración crédito",`${fmtNum(T.cred)} créditos · meta ${T.pcCred?Math.round(T.pcCred)+"%":"—"}`,"creditos")}
      ${usados?"":gaugeSvg(ratio(T.ci,T.cred),T.pcCI/100,"Compra Inteligente",`${fmtNum(T.ci)} de ${fmtNum(T.cred)} · meta ${T.pcCI?Math.round(T.pcCI)+"%":"—"}`,"ci")}
      ${usados?"":gaugeSvg(ratio(T.mpp,T.cred),T.pcMPP/100,"MPP",`${fmtNum(T.mpp)} de ${fmtNum(T.cred)} · meta ${T.pcMPP?Math.round(T.pcMPP)+"%":"—"}`,"mpp")}
      ${gaugeSvg(ratio(T.seg,T.ventas),T.pcSeg/100,"Penetración seguros",`${fmtNum(T.seg)} seguros · meta ${T.pcSeg?Math.round(T.pcSeg)+"%":"—"}`,"seguros")}
      ${gaugeSvg(ratio(T.leadsSol,T.leads),null,"SOL-COT",`${fmtNum(T.leadsSol)} de ${fmtNum(T.leads)} leads`,"leads")}
      ${gaugeSvg(ratio(T.ventasLead,T.leads),null,"Cierre leads",`${fmtNum(T.ventasLead)} ventas desde lead`,"leads")}
    </div>`;
    if(!rows.length){ $("#res").innerHTML=`<div class="empty">No hay ventas, créditos, seguros ni leads en ${MESES[mes-1]} ${anio}.</div>`; return; }
    const TT=suma(rows);
    if(usados&&metaUsados){ TT.meta=metaUsados.meta_ventas||0; TT.pcCred=+metaUsados.pct_credito||0; TT.pcSeg=+metaUsados.pct_seguro||0; }
    let html=`<div class="imp-head"><h3>DITALCAR · ${usados?"USADOS":"NUEVOS"} · ${MESES[mes-1]} ${anio}</h3><span class="hint">▸ junto a cada marca abre los locales con datos</span><span class="hint">${fmtNum(TT.ventas)} ventas válidas · ${fmtNum(TT.nulas)} nulas · resultado facturado ${fmtMoney(TT.monto)}</span></div>${gauges(TT)}`;
    if(usados){ html+=`<div class="imp-head"><h3>SEMINUEVOS</h3><span class="hint">todas las marcas de usados en una sola línea</span></div>`+tablaImp(rows,"TOTAL USADOS"); }
    else for(const impN of IMPORTADORES){
      const rs=rows.filter(r=>r.imp===impN); if(!rs.length) continue;
      const T=suma(rs);
      html+=`<div class="imp-head"><h3>${impN==="OTROS"?"OTRAS MARCAS / SEMINUEVOS":impN}</h3><span class="hint">${rs.length} marcas · ${fmtNum(T.ventas)} ventas</span></div>${rs.length>1?gauges(T):""}${tablaImp(rs,"TOTAL "+(impN==="OTROS"?"OTRAS":impN))}`;
    }
    html+=`<p class="hint" style="margin-top:10px">Ventas = válidas (sin nulas); las nulas se cuentan aparte. Nuevo/usado según Código Vehículo (VU), factura FEE o local de Usados; créditos y seguros se clasifican cruzando con la venta de SIGA (N° operación, N° propuesta o RUT). La meta total de seminuevos se fija en Metas → Por marca, fila USADOS. Créditos = cursados en el mes (sin refinanciamientos), separando nuevo/usado por Estado Vehículo de la financiera. CI = Compra Inteligente / Crediya Inteligente / Black 50-50 cursados. MPP = cursados con mantención prepagada. Seguros = HDI con emisión Activa. Metas por marca en Metas → Por marca.</p>`;
    $("#res").innerHTML=html; $("#res").classList.remove("empty"); bindExp($("#res"));
    const exportCols=cols.map(c=>({h:c.h,f:c.f})); exportCols[0]={h:"Marca",f:r=>esc(r.marca)}; exportCols.splice(1,0,{h:"Importador",f:r=>esc(r.imp)});
    ultimo={cols:exportCols,rows};
  };
  ["rMes","rAnio","rTipo","rImp","fLocal"].forEach(id=>$("#"+id).addEventListener("change",run));
  $("#rExcel")?.addEventListener("click",()=>exportarExcel("Resumen_marcas",ultimo.cols,ultimo.rows));
  await run();
};
</script>
</body>
</html>
